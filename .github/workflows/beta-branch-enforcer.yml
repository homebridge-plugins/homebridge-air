name: Beta Branch Enforcer

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-beta-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR targets beta branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const baseBranch = pr.base.ref;
            const headBranch = pr.head.ref;
            
            // Allow direct merges to latest only from beta branches
            if (baseBranch === 'latest' && !headBranch.startsWith('beta-')) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Beta Branch Required**
                
                This PR is targeting the \`latest\` branch but should target a beta branch first.
                
                **Required Actions:**
                1. Create or identify the appropriate beta branch (format: \`beta-X.Y.Z\`)
                2. Change the base branch of this PR to target the beta branch
                3. Ensure the related issue has the appropriate semantic versioning label (\`patch\`, \`minor\`, or \`major\`)
                
                **Semantic Versioning Labels:**
                - \`patch\`: Bug fixes, security patches, minor corrections (X.Y.Z+1)
                - \`minor\`: New features, backwards-compatible functionality (X.Y+1.0)  
                - \`major\`: Breaking changes, major architectural changes (X+1.0.0)
                
                Please see our [Contributing Guide](./CONTRIBUTING.md) and [Copilot Instructions](./.github/copilot-instructions.md) for more details.`
              });
              
              core.setFailed('PR must target a beta branch, not latest directly');
            }
            
            // Check if targeting a beta branch
            if (baseBranch.startsWith('beta-')) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ **Beta Branch Target Confirmed**
                
                This PR correctly targets the beta branch \`${baseBranch}\`.
                
                **Next Steps:**
                1. Ensure all tests pass
                2. Complete the PR checklist
                3. After merge and testing, this beta branch can be merged to \`latest\``
              });
            }

  check-semantic-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check for semantic versioning labels on linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prBody = pr.body || '';
            
            // Extract issue numbers from PR body
            const issueNumbers = prBody.match(/(?:fixes|closes|resolves)\s+#(\d+)/gi);
            
            if (!issueNumbers) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `ℹ️ **No linked issues found**
                
                This PR doesn't appear to reference any issues. Please ensure:
                1. The PR description includes "Fixes #X" or "Closes #X" for related issues
                2. Related issues have appropriate semantic versioning labels (\`patch\`, \`minor\`, \`major\`)`
              });
              return;
            }
            
            let hasSemanticLabel = false;
            
            for (const match of issueNumbers) {
              const issueNumber = match.match(/\d+/)[0];
              
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNumber)
                });
                
                const labels = issue.data.labels.map(label => label.name);
                const semanticLabels = ['patch', 'minor', 'major'];
                const hasLabel = semanticLabels.some(label => labels.includes(label));
                
                if (hasLabel) {
                  hasSemanticLabel = true;
                  const semanticLabel = semanticLabels.find(label => labels.includes(label));
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `✅ **Semantic Label Found**
                    
                    Issue #${issueNumber} has the \`${semanticLabel}\` label, which is correct for semantic versioning.`
                  });
                } else {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `⚠️ **Missing Semantic Label**
                    
                    Issue #${issueNumber} is missing a semantic versioning label. Please add one of:
                    - \`patch\`: Bug fixes, security patches, minor corrections
                    - \`minor\`: New features, backwards-compatible functionality  
                    - \`major\`: Breaking changes, major architectural changes`
                  });
                }
              } catch (error) {
                console.log(`Could not fetch issue #${issueNumber}: ${error.message}`);
              }
            }